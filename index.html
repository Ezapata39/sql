<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Theory Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Chess Theory Simulator</h1>
      <nav>
        <button class="tab-btn active" data-tab="play">Free Play</button>
        <button class="tab-btn" data-tab="openings">Opening Explorer</button>
        <button class="tab-btn" data-tab="trainer">Opening Trainer</button>
        <button class="tab-btn" data-tab="theory">Theory Guide</button>
      </nav>
    </header>

    <main>
      <!-- FREE PLAY TAB -->
      <section id="tab-play" class="tab-content active">
        <div class="board-layout">
          <div class="board-container">
            <div id="board-play" class="chess-board"></div>
            <div class="board-controls">
              <button id="flip-board-play">Flip Board</button>
              <button id="reset-play">New Game</button>
              <button id="undo-play">Undo Move</button>
            </div>
          </div>
          <div class="side-panel">
            <div class="status-box">
              <div id="play-status" class="status-text">White to move</div>
              <div id="play-check" class="check-indicator"></div>
            </div>
            <div class="move-history-box">
              <h3>Move History</h3>
              <div id="play-history" class="move-list"></div>
            </div>
            <div class="captured-box">
              <h3>Captured Pieces</h3>
              <div id="captured-white" class="captured-row"><span>White lost:</span><span class="pieces"></span></div>
              <div id="captured-black" class="captured-row"><span>Black lost:</span><span class="pieces"></span></div>
            </div>
            <div class="eval-box">
              <h3>Position Info</h3>
              <div id="play-fen" class="fen-display"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- OPENING EXPLORER TAB -->
      <section id="tab-openings" class="tab-content">
        <div class="board-layout">
          <div class="board-container">
            <div id="board-openings" class="chess-board"></div>
            <div class="board-controls">
              <button id="flip-board-openings">Flip Board</button>
              <button id="prev-opening-move">&#9664; Prev</button>
              <button id="next-opening-move">Next &#9654;</button>
              <button id="reset-opening">Reset</button>
            </div>
            <div id="opening-move-progress" class="move-progress"></div>
          </div>
          <div class="side-panel">
            <div class="opening-selector">
              <h3>Select Opening</h3>
              <select id="opening-select">
                <option value="">-- Choose an Opening --</option>
              </select>
              <div id="opening-info" class="opening-info-box"></div>
            </div>
            <div class="move-history-box">
              <h3>Opening Moves</h3>
              <div id="opening-moves-display" class="move-list"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- OPENING TRAINER TAB -->
      <section id="tab-trainer" class="tab-content">
        <div class="board-layout">
          <div class="board-container">
            <div id="board-trainer" class="chess-board"></div>
            <div class="board-controls">
              <button id="flip-board-trainer">Flip Board</button>
              <button id="trainer-hint">Show Hint</button>
              <button id="trainer-next">Skip Move</button>
              <button id="trainer-restart">Restart</button>
            </div>
          </div>
          <div class="side-panel">
            <div class="opening-selector">
              <h3>Train Opening</h3>
              <select id="trainer-opening-select">
                <option value="">-- Choose an Opening --</option>
              </select>
              <div id="trainer-side-select" class="side-select">
                <label><input type="radio" name="trainer-side" value="white" checked /> Play as White</label>
                <label><input type="radio" name="trainer-side" value="black" /> Play as Black</label>
              </div>
              <button id="trainer-start" class="btn-primary">Start Training</button>
            </div>
            <div id="trainer-status" class="trainer-status-box">
              <div id="trainer-message" class="trainer-message">Select an opening and press Start Training</div>
              <div id="trainer-progress" class="trainer-progress"></div>
              <div id="trainer-score" class="trainer-score"></div>
            </div>
            <div class="move-history-box">
              <h3>Moves Completed</h3>
              <div id="trainer-history" class="move-list"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- THEORY GUIDE TAB -->
      <section id="tab-theory" class="tab-content">
        <div class="theory-layout">
          <div class="theory-sidebar">
            <h3>Topics</h3>
            <ul id="theory-topics"></ul>
          </div>
          <div class="theory-content" id="theory-content"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="chess.js"></script>
  <script src="openings.js"></script>
  <script src="theory.js"></script>
  <script src="board.js"></script>
  <script src="app.js"></script>
</body>
</html>
